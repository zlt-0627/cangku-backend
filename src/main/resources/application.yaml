spring:
  # 本地开发用的密码放在项目根目录的 .env 里（已被 .gitignore 排除，不会进仓库）
  # 没有 .env 时会读环境变量；两边都没有，启动就直接失败 —— 这是故意的，免得用错库还浑然不知
  config:
    import: optional:file:.env[.properties]

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/tlias}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
  application:
    name: chanku

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: 100ms

# JWT 配置
# secret 至少 32 个字符（HS256 的硬性要求），正式环境用环境变量 JWT_SECRET 覆盖
jwt:
  secret: ${JWT_SECRET:chanku-dev-secret-key-change-me-0123456789}
  expire-minutes: ${JWT_EXPIRE_MINUTES:30}

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    # 打印SQL日志
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 开启下划线转驼峰：goods_name → goodsName
    map-underscore-to-camel-case: true

sour:
  name: zhu

server:
  port: 8081
  address: 0.0.0.0
